name: APK Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Clé de signature
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then echo "::error::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD manquants"; exit 1; fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Compiler l'APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk PetitsPolyglottes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PetitsPolyglottes-apk
          path: PetitsPolyglottes.apk
      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" PetitsPolyglottes.apk --title "Petits Polyglottes (APK ${{ github.run_number }})" \
            --notes "APK Android à installer sur le téléphone."
